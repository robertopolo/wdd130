<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta
      name="description"
      content="This is the trips page for the Whitewaters Rafting Site"
    />
    <meta name="author" content="Roberto Polo" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Montserrat:ital,wght@0,100..900;1,100..900&family=Poppins:ital,wght@0,100;0,200;0,300;0,400;0,500;0,600;0,700;0,800;0,900;1,100;1,200;1,300;1,400;1,500;1,600;1,700;1,800;1,900&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="styles/rafting.css" />
    <title>Home - Rapids</title>
  </head>
  <body>
    <header>
      <img src="images/rapids-logo.webp" alt="rapids-logo" />
      <nav>
        <a href="index.html">Home</a>
        <a href="about.html">About</a>
        <a href="trips.html">Trips</a>
        <a href="contact.html">Contact us</a>
      </nav>
    </header>
    <div class="hero">
      <img src="./images/trips-hero.webp" alt="trip" />
      <h1>Book a trip</h1>
    </div>
    <main>
      <div class="caption-trips">
        <p>
          Reservations can be made below with our booking widgets or via phone
          by calling 800-123-4567. Reservations made online require at least 3
          days advanced notice. Some dates are unavailable if fully booked.
        </p>
        <button>Book now</button>
      </div>
      <section class="trips">
        <div class="trip-item">
          <figure>
            <figcaption>1/2 day raft trip</figcaption>
            <img src="./images/trips-1.webp" alt="trip-1" />
          </figure>
          <button>Book now</button>
        </div>
        <div class="trip-item">
          <figure>
            <figcaption>1 day raft trip</figcaption>
            <img src="./images/trips-2.webp" alt="trip-2" />
          </figure>
          <button>Book now</button>
        </div>
        <div class="trip-item">
          <figure>
            <figcaption>2 day raft trip</figcaption>
            <img src="./images/trips-3.webp" alt="trip-3" />
          </figure>
          <button>Book now</button>
        </div>
        <div class="trip-item">
          <figure>
            <figcaption>3 day raft trip</figcaption>
            <img src="./images/trips-4.webp" alt="trip-4" />
          </figure>
          <button>Book now</button>
        </div>
        <div class="trip-item">
          <figure>
            <figcaption>4 or 5 day raft trip</figcaption>
            <img src="./images/trips-5.webp" alt="trip-5" />
          </figure>
          <button>Book now</button>
        </div>
        <div class="trip-item">
          <figure>
            <figcaption>Weekend</figcaption>
            <img src="./images/trips-6.webp" alt="trip-6" />
          </figure>
          <button>Book now</button>
        </div>
      </section>
    </main>
    <footer>
      <p>&copy; 2024 | 🌊 Rapids 🌊 | Roberto Polo</p>
      <div class="footer-images">
        <a href="https://facebook.com">
          <img src="images/facebook-logo.webp" alt="facebook-logo" />
        </a>
        <a href="https://instagram.com">
          <img src="images/instagram-logo.webp" alt="instagram-logo" />
        </a>
        <a href="https://x.com">
          <img src="images/x-logo.webp" alt="x-logo" />
        </a>
      </div>
    </footer>
  </body>
</html>
