<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Montserrat:ital,wght@0,100..900;1,100..900&family=Poppins:ital,wght@0,100;0,200;0,300;0,400;0,500;0,600;0,700;0,800;0,900;1,100;1,200;1,300;1,400;1,500;1,600;1,700;1,800;1,900&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="styles/poll-form.css" />
    <title>WDD 130 | Roberto Polo - User Poll</title>
  </head>
  <body>
    <header>
      <h1>WDD 130 | Roberto Polo | HTML Form - User Poll</h1>
    </header>
    <main>
      <form>
        <fieldset>
          <legend>Contact Information</legend>
          <div class="form-item column2">
            <label for="fullname">Full Name:</label>
            <input type="text" name="fullname" id="fullname" />
          </div>
          <div class="form-item column2">
            <label for="useremail">Email</label>
            <input type="email" name="useremail" id="useremail" />
          </div>
        </fieldset>
        <fieldset>
          <legend>Questions</legend>
          <div class="form-item column1">
            <label for="browser">What is your favorite internet browser?</label>
            <select name="browser" id="browser">
              <option value="chrome">Chrome</option>
              <option value="chrome">Firefox</option>
              <option value="chrome">Safari</option>
              <option value="chrome">Edge</option>
              <option value="chrome">Brave</option>
              <option value="chrome">Other</option>
            </select>
          </div>
          <div class="form-item column1">
            <label for="pet">Do you have a household pet?</label>
            <input type="checkbox" name="pet" id="pet" />
          </div>
          <div class="form-item column1">
            <label for="feedback">List the places you have lived</label>
            <textarea
              name="feedback"
              id="feedback"
              rows="4"
              placeholder="Stillwater Florida, Amsterdam Netherlands, Tibuktu Mali"
            ></textarea>
          </div>
        </fieldset>
        <button type="submit">Submit Poll</button>
      </form>
    </main>
    <footer>
      <p>&copy; 2024 | HTML Form - User Poll Activity | Roberto Polo</p>
    </footer>
  </body>
</html>
